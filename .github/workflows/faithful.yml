name: Faithful source verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify every pinned upstream file
        run: node .luxleaf/verify-source.mjs
      - run: npm install --global yarn@1.22.22 --force
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn run postinstall
      - run: yarn build
      - run: yarn test --runInBand --watchman=false
      - run: yarn workspace example build
      - name: Build LuxLeaf motion demonstration
        run: node node_modules/vite/bin/vite.js build --config .luxleaf/motion/vite.config.mjs
      - run: node .luxleaf/verify-source.mjs
